services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: cloudguard-dlp-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - SECURITY_MODE=${SECURITY_MODE:-remediated}
    volumes:
      - ../storage_buckets:/app/storage_buckets
      - ../data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: cloudguard-dlp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
